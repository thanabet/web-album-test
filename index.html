<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intromie Photo Album (M1)</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <main id="app" class="app">
    <div id="table" class="table">
      <!-- subtle vignette -->
      <div class="vignette"></div>

      <!-- stage controls area (invisible) -->
      <div id="stage" class="stage" aria-label="Album stage">
        <!-- Album wrapper (moves/poses) -->
        <div id="albumWrap" class="album-wrap pose-closed" role="group" aria-label="Album">
          <!-- CLOSED: show a single cover -->
          <button id="coverBtn" class="cover" type="button" aria-label="Tap to open album">
            <div class="cover-face front">
              <div class="cover-title">
                <div class="brand">Intromie</div>
                <div class="name">Photo Album</div>
                <div class="hint">Tap to open</div>
              </div>
            </div>
            <div class="cover-edge"></div>
          </button>

          <!-- OPEN: spread (left + right) -->
          <div id="spread" class="spread" aria-hidden="true">
            <div class="page left">
              <div class="paper">
                <div class="paper-inner">
                  <div id="leftLabel" class="label"></div>
                  <div class="sleeve"></div>
                </div>
              </div>
              <div id="tapLeft" class="tap-zone tap-left" title="Tap left to go back"></div>
            </div>

            <div class="page right">
              <div class="paper">
                <div class="paper-inner">
                  <div id="rightLabel" class="label"></div>
                  <div class="sleeve"></div>
                </div>
              </div>
              <div id="tapRight" class="tap-zone tap-right" title="Tap right to go next"></div>
            </div>

            <!-- center gutter shadow -->
            <div class="gutter"></div>
          </div>
        </div>

        <!-- tiny debug (optional) -->
        <div id="hud" class="hud" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
