<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Intromie Photo Album (M1)</title>
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/album.css" />
  <link rel="stylesheet" href="./css/flip.css" />
</head>
<body>
  <div class="app">
    <!-- WORLD (always landscape) -->
    <div id="world" class="world">
      <!-- TABLE LAYER -->
      <div id="table" class="table">
        <div class="table-img" id="tableImg"></div>
        <div class="vignette"></div>
      </div>

      <!-- STAGE -->
      <div class="stage" id="stage">
        <!-- ALBUM ROOT -->
        <div id="album" class="album state-closed">
          <!-- CLOSED BOOK (horizontal) -->
          <button id="coverBtn" class="cover-btn" type="button" aria-label="Open album">
            <div id="book" class="book">
              <div class="book-cover book-front">
                <div class="cover-text">
                  <div class="brand">Intromie</div>
                  <div class="name">Photo Album</div>
                </div>
                <div class="cover-tex" id="coverFrontTex"></div>
              </div>

              <div class="book-spine-left"></div>

              <div class="book-cover book-back">
                <div class="cover-tex" id="coverBackTex"></div>
              </div>

              <div class="book-shadow"></div>
            </div>
          </button>

          <!-- OPEN SPREAD -->
          <div id="spread" class="spread" aria-hidden="true">
            <div class="page page-left">
              <div class="page-bg" id="pageBgLeft"></div>
              <div class="page-content" id="pageLeft"></div>
              <div class="tap-zone tap-left" id="tapLeft" aria-label="Prev"></div>
            </div>

            <div class="page page-right">
              <div class="page-bg" id="pageBgRight"></div>
              <div class="page-content" id="pageRight"></div>
              <div class="tap-zone tap-right" id="tapRight" aria-label="Next"></div>
            </div>

            <!-- Spine overlay (user image, narrow) -->
            <div class="spine-overlay">
              <img id="spineImg" class="spine-img" alt="" />
            </div>

            <!-- Flip overlay mount -->
            <div id="flipLayer" class="flip-layer" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
