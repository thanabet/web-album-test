<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Intromie Photo Album (M1 - Real Album)</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <main class="app">
    <div class="table">
      <div class="vignette"></div>

      <div id="stage" class="stage">
        <div id="album" class="album pose-closed">

          <!-- CLOSED BOOK -->
          <button id="coverBtn" class="cover-btn" type="button" aria-label="Tap to open album">
            <div id="book" class="book book-front">
              <div class="book-face">
                <div class="cover-title">
                  <div class="brand">Intromie</div>
                  <div class="name">Photo Album</div>
                  <div class="hint">Tap to open</div>
                </div>
              </div>
              <div class="book-spine"></div>
              <div class="book-drop"></div>
            </div>
          </button>

          <!-- OPEN ALBUM (spread) -->
          <div id="openWrap" class="open-wrap" aria-hidden="true">
            <div class="open-frame">
              <!-- this frame is the "outer cover border" you see around inner pages -->
              <div class="inner">

                <div class="page left">
                  <!-- inside cover OR photo slot -->
                  <div id="leftContent" class="page-content"></div>
                  <div id="tapLeft" class="tap-zone tap-left" aria-label="Tap left to go back"></div>
                </div>

                <div class="page right">
                  <div id="rightContent" class="page-content"></div>
                  <div id="tapRight" class="tap-zone tap-right" aria-label="Tap right to go next"></div>
                </div>

                <!-- SPINE overlay (user provided image) -->
                <div class="spine">
                  <img class="spine-img" src="./assets/spine/spine_01.png" alt="">
                </div>

              </div>
            </div>
          </div>

        </div>

        <div id="hud" class="hud" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
